name: Fix new committee photos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[committee-photo-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Move new photos and update HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p committee
          for f in Hema_S_Nair.jpg Jose_Manual.jpg Nimmy.jpg; do
            if [ -f "$f" ]; then
              mv "$f" "committee/$f"
            fi
          done

          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def card(file,name):
              return f'<div class="person"><img class="portrait" src="committee/{file}" alt="{name}"><b>{name}</b></div>'

          additions=[
              ('Hema S Nair','Hema_S_Nair.jpg'),
              ('Jose Manual','Jose_Manual.jpg'),
              ('Nimmy','Nimmy.jpg'),
          ]
          for name,file in additions:
              if f'alt="{name}"' in s:
                  s=s.replace(f'src="committee/{file}"',f'src="committee/{file}"')
                  continue
              s=s.replace('</div></div></section><section id="memories">', card(file,name) + '</div></div></section><section id="memories">') if False else s

          # Rebuild only the committee grid contents so alphabetical order is guaranteed.
          start=s.find('<div class="committee">')
          end=s.find('</div></div></section><section id="memories">', start)
          if start==-1 or end==-1:
              raise SystemExit('Committee section not found')
          existing=s[start:end+len('</div>')]
          names={
              'Bindhu':'Bindhu.jpg','Elizabeth':'Elizabeth.jpg','Heera':'Heera.jpg','Jyothish':'Jyothish.jpg','Justin':'Justin.jpg','Lakshmi':'Lakshmi.jpg','Manju':'Manju.jpg','Paul':'Paul.jpg','Rony':'Rony.jpg','Sajeev':'Sajeev.jpg','Sankar':'Sankar.jpg','Sheeba':'Sheeba.jpg','Shila Raj':'Shila_Raj.jpg','Shreeja':'Shreeja.jpg','Sofiya':'Sofiya.jpg','Sunjith':'Sunjith.jpg','Viji':'Viji.jpg','Vijay':'Vijay.jpg','Zach':'Zach.jpg'
          }
          for name,file in additions:
              if Path('committee',file).is_file() and Path('committee',file).stat().st_size>10000:
                  names[name]=file
          def sortkey(x): return x[0].lower()
          cards=''.join(card(file,name) for name,file in sorted(names.items(), key=sortkey))
          s=s[:start] + '<div class="committee">' + cards + '</div>' + s[end+len('</div>'):]
          p.write_text(s,encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-new-committee.yml
          git add index.html committee .github/workflows/fix-new-committee.yml
          git commit -m 'Fix new committee photos [committee-photo-fix]' || exit 0
          git push
